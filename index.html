<!DOCTYPE html>
<html>
  <head>
    <title>AR.js – Vídeo com Marcador Personalizado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { position: absolute; top: 0; left: 0; }
    </style>
  </head>
  <body>
    <video id="tremVideo" src="./assets - Copia/horizontal.mp4" autoplay loop muted playsinline webkit-playsinline style="display:none;"></video>

    <a-scene embedded arjs="debugUIEnabled: false" vr-mode-ui="enabled: false">
      <a-marker type="pattern" url="./assets - Copia/pattern-trem.patt">
        <a-video src="#tremVideo" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.1"></a-video>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('load', () => {
        const video = document.getElementById('tremVideo');
        video.play().catch(err => {
          console.warn('Erro ao iniciar vídeo:', err);
        });
      });
    </script>
  </body>
</html>
