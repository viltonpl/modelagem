<!DOCTYPE html>
<html>
  <head>
    <title>AR.js com marcador Hiro - Vídeo em Tela Cheia</title>
    <!-- A-Frame e AR.js já lidam com a meta viewport para responsividade -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <!-- O elemento de vídeo. Ele está oculto por padrão, e o AR.js usará sua fonte. -->
    <!-- Por favor, note que o formato MKV pode não ser amplamente suportado pelos navegadores. -->
    <!-- É altamente recomendável usar um formato como MP4 para melhor compatibilidade. -->
    <!-- O atributo 'loop' já garante que o vídeo se repita. -->
    <video id="meuvideo" src="video.mkv" autoplay loop crossorigin="anonymous" playsinline webkit-playsinline muted style="display: none;"></video>

    <!-- Cena A-Frame para AR.js -->
    <!-- 'vr-mode-ui="enabled: false"' desabilita o botão VR, e 'embedded' ajuda na integração. -->
    <!-- 'arjs="debugUIEnabled: false"' remove a interface de depuração. -->
    <a-scene vr-mode-ui="enabled: false" embedded arjs="debugUIEnabled: false">
      <!-- Define o marcador Hiro -->
      <a-marker preset="hiro">
        <!-- O componente a-video exibirá o vídeo quando o marcador for detectado -->
        <!-- src="#meuvideo" referencia o elemento de vídeo pelo seu ID -->
        <!-- A largura e a altura são relativas ao marcador, garantindo que o vídeo se adapte. -->
        <!-- A posição e rotação são ajustadas para que o vídeo apareça corretamente sobre o marcador. -->
        <a-video src="#meuvideo" width="4" height="2.25" position="0 0 0" rotation="-90 0 0"></a-video>
      </a-marker>
      <!-- Entidade da câmera para a cena AR -->
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
